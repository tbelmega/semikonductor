# $schema: ../schemas/workflow.schema.json
# yaml-language-server: $schema=../schemas/workflow.schema.json

# SPDX-License-Identifier: Apache-2.0
#
# Konductor's six-phase chain, from the "SDLC Workflow" and "Verification Protocol" sections of the
# removed Konductor agent prompt and its phase agents (k-product-manager, k-architect, k-tpm,
# k-developer, k-quality-assurance on the konductor main branch). Skills are named by their name;
# they ship with fuse-konductor. Deliberate deviations from the source:
# - No owner gates: the chain runs through, and the owner reads the results at the end.
# - The independent checker runs on the user stories, the design and the code; the feature split
#   and the specs are checked by their own guides only, to keep the chain light.
# - Per-feature work happens inside one step per phase, because fuse-flow has no loops.
# - QA reports its findings instead of handing them back to the developer. QA is the last step
#   and has no owner gate, so the workflow is complete when it ends and cannot be sent back; the
#   agent recommends follow-on work when a gap leaves an acceptance criterion untested.
version: 1
name: k-phase-chain
description: Konductor's lighter six-phase chain, PM through QA, with no owner gates, from the "SDLC
  Workflow" and "Verification Protocol" sections of the removed Konductor agent prompt.
steps:
  - id: pm
    title: 1. PM
    instruction: Write the user stories and acceptance criteria from the request.
    produces:
      - artifact: user-stories
        path: .konductor/{slug}/user-stories.md
    gates:
      - agent: check the user stories and acceptance criteria against the request; a story the request does not support, or a request with no story, is a required fix
        max_rounds: 2
  - id: architect
    title: 2. Architect
    instruction: >
      Write the system design: architecture, non-functional requirements, a threat model (the
      threat-model guide, fuse/flow/library/artifacts/threat-model/guide.md in the fuse-konductor
      clone), API and data models, access policies. Cite code for every claim
      about current behaviour.
    produces:
      - artifact: design
        path: .konductor/{slug}/design.md
    consumes:
      - user-stories
    gates:
      - agent: >
          review the design and its threat model for flaws that would block implementation, and
          check every claim about the code against the code (the doc-accuracy-analyzer skill)
        max_rounds: 2
  - id: feature-splitting
    title: 3. Feature splitting
    instruction: |
      Split the design into features that can be built independently and give each a unique slug.
      Every user story belongs to at least one feature.
    produces:
      - artifact: feature-split
        path: .konductor/{slug}/feature-split.md
    consumes:
      - user-stories
      - design
  - id: specs
    title: 4. Developer (specs, per feature)
    instruction: >
      For each feature in the split write requirements.md, design.md and tasks.md, as the spec
      index guide says, in the feature's spec directory: <feature>/ inside the feature-specs folder
      below, which a project's policy can move. When the project's house rules keep feature specs
      elsewhere and its policy has not moved the folder, write them there, and report the folder
      not produced with that location. Then list the spec directories in the index.
    produces:
      - artifact: spec-index
        path: .konductor/{slug}/spec-index.md
      - artifact: feature-specs
        path: .kiro/specs/
    consumes:
      - feature-split
      - user-stories
      - design
  - id: implementation
    title: 5. Developer (implementation, per feature)
    instruction: >
      Implement each feature from its tasks.md with tests. Commit as the project's house rules say,
      whether, when and how finely to commit and how to write the message, and say that you
      followed them; where they say nothing, commit each feature separately and name the
      feature's slug in the message. Record per feature its changed files, its commits if any and
      the check's result in the implementation report, so code review can find each feature's
      diff whatever the commit shape.
    produces:
      - artifact: implementation-report
        path: .konductor/{slug}/implementation-report.md
    consumes:
      - spec-index
      - feature-specs
    updates:
      - artifact: code
        path: .
    gates:
      - check: default
  - id: code-review
    title: 5a. Code review (per feature)
    instruction: >
      Have the git diff of each feature, as the implementation report records it, reviewed as the
      gate below says, fix every CRITICAL finding in the implementation, and record the review.
    produces:
      - artifact: code-review
        path: .konductor/{slug}/code-review.md
    consumes:
      - spec-index
      - implementation-report
    updates:
      - artifact: code
        path: .
    gates:
      - check: default
      - agent: >-
          review the git diff of each feature; a CRITICAL finding fails the round. Of the files
          the review names next, the code review record is the author's account of the review:
          check only that it does not misreport it
        max_rounds: 2
        route_back_to: implementation
  - id: qa
    title: 6. QA
    instruction: >
      Find the test coverage gaps for what was implemented, plan the end-to-end tests (the
      e2e-test-strategy guide, fuse/flow/library/artifacts/e2e-test-strategy/guide.md in the
      fuse-konductor clone) and the security tests, and check user-facing text when there is
      any; each is a section of the report, and the test coverage guide names the guides for the
      security tests and the user-facing text.
      This is the last step; findings are reported, not routed back to implementation, and the
      workflow ends with this step. Put any gap that leaves an acceptance criterion untested at
      the top, and in the hand-over recommend closing it as follow-on work started after this
      workstream.
    produces:
      - artifact: test-coverage
        path: .konductor/{slug}/test-coverage.md
    consumes:
      - user-stories
      - spec-index
      - implementation-report
      - code-review
