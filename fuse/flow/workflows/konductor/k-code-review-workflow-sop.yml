# $schema: ../schemas/workflow.schema.json
# yaml-language-server: $schema=../schemas/workflow.schema.json
# above comments enable live schema validation in WebStorm and vscode
# SPDX-License-Identifier: Apache-2.0
#
# A port of the former k-code-review-workflow SOP from Konductor
# (agent-sops/k-code-review-workflow.sop.md in aws-solutions/konductor), steps 1 to 7 in order.
# Skills are named by their name; they ship with fuse-konductor in the clone's skills/ folder.
# Deliberate deviations from the SOP:
# - Parameters: fuse-flow has no workflow parameters, so the discover step collects source_dir,
#   review_type, cr_url and base_branch from the owner. output_file becomes the
#   code-review-report artifact under .konductor/{slug}/, which a project's policy can move.
# - Steps 1 and 2 are one step, and so are steps 3 and 4, because each pair hands on one
#   document. The diff is saved as the review-diff artifact, so every later step and the
#   adversarial review read the same text.
# - The lenses are told to report every finding and leave fixing to the caller
#   (scope_confirmed), because the SOP only reports and never fixes.
# - The infrastructure lens will not start without the infrastructure type, the location and the
#   target environment, and the SOP passes none of them. The discover step records the type and
#   location from the categorized files and asks the owner for the environment when there are
#   infra files.
# - Step 6 calls the k-adversarial-pull-request-review SOP. Here the adversarial step delegates to
#   its port, k-adversarial-pull-request-review-sop, through a workflow gate: fuse-flow creates a
#   child workstream for each pass of the step, gives it the review diff and the review scope as
#   its inputs, and returns its report to the report step as adversarial-report. The gate needs
#   the port to exist, so the SOP's skip when that SOP is unavailable does not apply.
# - Step 6's merge of new adversarial findings happens in the report step, so that the report
#   step always reads the critique's findings, also when step 6 is skipped. The review findings
#   file therefore holds the standard findings only, and the report holds both.
# - When the review falls back to listing every file under source_dir, there is no diff, so the
#   critique checks quoted code against the files themselves; the SOP names only the diff.
# - The SOP names the verdicts READY FOR REVIEW and NEEDS FIXES without a rule. Here a surviving
#   CRITICAL or IMPORTANT issue means NEEDS FIXES, since every lens's gate classes IMPORTANT as
#   "should fix".
# - The SOP has no owner gate and no review of its own report; neither does this workflow.
version: 1
name: k-code-review-workflow-sop
description: Port of the former k-code-review-workflow SOP. A multi-skill review of the changed
  backend, frontend and infrastructure files, a false-positive critique, an adversarial second
  pass, and one prioritized report with a verdict. Reports only; it does not fix.
steps:
  - id: discover
    title: 1 and 2. Discover and categorize changed files
    phase: Scope
    instruction: |
      Find the files to review and sort them into categories. This step changes no file other than
      this workflow's own artifacts.

      The parameters. source_dir is required; ask the owner for it when it is missing. review_type
      is backend, frontend, infra or all, and defaults to all. Note a code review URL (cr_url) when
      the owner gives one. When the owner gives no base_branch, resolve the remote's default branch:
      run `git symbolic-ref --quiet --short refs/remotes/origin/HEAD` and strip the `origin/`
      prefix; when that returns nothing, run `git ls-remote --symref origin HEAD` and take the branch
      from its `ref: refs/heads/<branch>` line; when neither gives a branch, use main. Do not try
      main first: a stale main must not win over the repository's real trunk.

      The diff. Run `git diff <base>...HEAD` (three dots, the merge-base form) within source_dir and
      keep the full diff with its hunks; the changed files are those in it. Leave out
      node_modules/, build/, dist/, cdk.out/, lock files and .js.map files. Write the diff to the
      review-diff artifact. When source_dir is not in a git repository (`git rev-parse
      --is-inside-work-tree` fails or prints false), list every file under source_dir recursively
      with the same exclusions and treat each as changed; report review-diff as not produced, with
      the reason "not a git repository; every file under source_dir is treated as changed". When the
      git diff command itself fails because its target is not a ref, say so explicitly rather than
      falling back silently, and ask the owner for base_branch. Only when nobody can answer, in an
      unattended run, use the recursive listing instead, and record that the diff target was
      unresolved and every file under source_dir was treated as changed, so the report can say so.

      The categories. Backend: .ts and .js files in paths matching **/handler*, **/service*,
      **/repository*, **/lambda*, **/util* or **/middleware*. Frontend: .tsx and .jsx files, and .ts
      files in **/component*, **/page* or **/hook*. Infra: .ts files in **/cdk*, **/stack*,
      **/construct* or **/infra*. A file that matches several categories goes to the first of
      infra, frontend, backend. Everything else is uncategorized. When review_type is not all, keep
      only the files of that category.

      When there are infra files, the infrastructure review needs the target environment
      (development, staging or production). Ask the owner for it unless they already said, and ask
      at the same time for any compliance requirements.

      Write the review scope: the parameters as resolved, including cr_url when the owner gave
      one, and how base was found, the diff command or the fallback used and why, the file lists
      per category including uncategorized, the counts per category, and for infra files the
      infrastructure type (CDK TypeScript, from the .ts files), their location and the
      environment.
    produces:
      - artifact: review-diff
        path: .konductor/{slug}/review.diff
      - artifact: review-scope
        path: .konductor/{slug}/review-scope.md

  - id: category-reviews
    title: 3 and 4. Run the review skills and consolidate
    phase: Review
    instruction: |
      Review each category with its lens, then merge the findings into one list. This step
      changes no file other than this workflow's own artifacts.

      Run the backend lens (fuse/flow/workflows/konductor/k-backend-review.md in the fuse-konductor
      clone) on the backend files, the frontend lens (k-frontend-review.md next to it) on the
      frontend files, and the infrastructure lens (k-infra-review.md next to it) on the infra
      files,
      giving it the infrastructure type, the location and the environment from the review scope.
      Skip a category that has no files or that review_type excludes, and say so. Tell each lens
      that the scope is confirmed: it reports every finding and leaves fixing to the caller, and
      it does not ask whether to fix them.

      Merge all findings into one list sorted CRITICAL, then IMPORTANT, then SUGGESTION, using each
      lens's own Quality Gate classes. Remove a finding that several lenses report, keeping one.
      Give every finding its file path and line, the lens that raised it, the problem, why it
      matters and the fix it proposed. Write the list as the review findings.
    consumes:
      - review-scope
      - review-diff
    produces:
      - artifact: review-findings
        path: .konductor/{slug}/review-findings.md

  - id: critique
    title: 5. Critique findings
    phase: Review
    instruction: |
      Check every finding to remove false positives; when in doubt, reject, because false
      positives erode trust in the review. Reject a finding that praises correct code, speculates
      about code that cannot be seen, flags a style-only issue, repeats what a linter run in this
      workflow already reported, or gives a vague suggestion without a concrete fix. Reject a
      finding whose quoted code does not match the actual diff, or the file itself when the review
      scope records that every file under source_dir was treated as changed. Keep only findings
      that state the problem, why it matters and a concrete fix. Sort the survivors again,
      CRITICAL, then IMPORTANT, then SUGGESTION. Move each rejected finding to a rejection log at
      the end of the review findings, with its reason. Change no other file.
    consumes:
      - review-scope
      - review-diff
    updates:
      - artifact: review-findings
        path: .konductor/{slug}/review-findings.md

  - id: adversarial-review
    title: 6. Adversarial review
    phase: Review
    condition:
      agent: review_type is not frontend. Otherwise skip this step and give that reason
    instruction: |
      Run the adversarial review to find gaps the standard review missed. It is the child
      workstream this step waits for, which fuse-flow creates with this review's diff and review
      scope as its inputs, a fresh one for each pass of this step. The child takes the diff, or
      the listed files when this review used the recursive listing, and the code review URL from
      those inputs. When the harness offers generic subagents, have a fresh subagent run the child
      to its end; otherwise run it yourself as a separate pass that does not reuse this review's
      conclusions. The child's report comes back as the adversarial report, and the report step
      merges its findings. Change no file other than the child's own artifacts.
    gates:
      - workflow: k-adversarial-pull-request-review-sop
        slug: "{slug}-adversarial"
        inputs: { given-diff: review-diff, given-scope: review-scope }
        returns: { adversarial-report: adversarial-review-report }

  - id: report
    title: 7. Generate the review report
    phase: Report
    instruction: |
      When the adversarial review ran, first apply the critique step's false-positive rules to the
      findings in its adversarial report, and add each new CRITICAL or IMPORTANT finding that
      survives to the findings for this report, marked as coming from the adversarial review. Do
      not report again a finding the review findings already have. Change no file other than the
      code review report.

      Write the review report from the review findings, without their rejection log, and the
      adversarial findings added to them. Give it the
      title `# Code Review Report`, then the lines `Date: <current date>` and `Files reviewed:
      <count by category>`. Then the section `## Summary` with the line `CRITICAL: N | IMPORTANT: N
      | SUGGESTION: N` and the verdict, then `## Critical Issues`, `## Important Issues` and `##
      Suggestions`, each a numbered list of its findings with file:line references. The verdict is
      NEEDS FIXES when a CRITICAL or IMPORTANT issue remains, and READY FOR REVIEW otherwise. When the review scope records that the diff target was
      unresolved, say in the report that every file under source_dir was treated as changed. Do
      not print the report in your message; give its path, the verdict and the counts. Do not
      offer to fix the issues.
    consumes:
      - review-scope
      - review-diff
      - review-findings
      - adversarial-report
    produces:
      - artifact: code-review-report
        path: .konductor/{slug}/code-review-report.md
