# $schema: ../schemas/workflow.schema.json
# yaml-language-server: $schema=../schemas/workflow.schema.json
#
# One feature in an existing codebase: agree a spec with the owner, build it against acceptance
# tests taken from the spec, and let independent agent review raise the bar before the owner
# looks. The steps say what to achieve and leave the how to the agent and its harness.
# Step and artifact names follow _k-phase-chain where they fit; review.md next to this file is
# the review guide for both agent gates.
#
# Start a workstream with:  fuse-flow start <slug> --workflow fuse-feature-development
version: 1
name: fuse-feature-development
description: >
  One feature in an existing codebase: a spec agreed with the owner, a build against acceptance
  tests taken from the spec, and independent agent review of both, before the owner approves the
  spec and lands the work or approves it for a pull request.
inputs:
  - artifact: build-order
    description: The system's build order, when the feature is part of a system.
  - artifact: requirements
    description: The system's requirements, when the feature is part of a system.
  - artifact: design
    description: The system's design, when the feature is part of a system.
  - artifact: product-brief
    description: The product brief of a prototype, when the feature hardens it in place.
hands_off_to:
  - workflow: fuse-pull-request
    when: >-
      only when the owner approved the work for a pull request or similar code review process at
      the last gate; take that approval as their agreement, and say which mechanism you will use
steps:
  - id: intake
    title: Intake
    phase: Design
    instruction: >
      Find out what the owner wants to build: get them to share their vision, however rough or
      detailed it is, and what problem it solves for whom. Read the code before you ask
      anything. While the purpose and rough scope are still unclear, ask rather than propose, one
      or a few questions at a time. If the request names one or more features from a system's
      build order, build them as one feature: take the scope from their briefs, read the system's
      requirements and design, and do not reopen decisions they already settle. As soon as the
      purpose and rough scope are settled, write a first draft of the spec, marked as a draft,
      with the questions still open; from then on, record each decision in the draft when it is
      made. When the request already settles the purpose and scope, write the draft straight away
      and say so. Before you write it, check where this workstream's documents go and whether they
      are committed. By default they go to the docs/specs/ paths and are committed with the work.
      Where the house rules keep such documents elsewhere, use that place and record it in
      .konductor/policy-overrides.yml under `artifacts:`, by artifact id. Where the house rules keep
      them private, as files that git ignores and nobody publishes, keep them in that ignored place
      and do not commit, push or land them; every later instruction to commit or land this
      workstream's documents then applies to the code only. If git ignores docs/specs/ and the house
      rules say nothing about it, ask the owner whether the documents stay private there or go to a
      place that is committed. Do not order the draft for review yet, and do not change code.
    consumes: [build-order, requirements, design, product-brief]
    produces:
      - artifact: feature-spec
        path: docs/specs/{date}-{slug}.md

  - id: design
    title: Design
    phase: Design
    instruction: >
      Turn the draft into the agreed spec: what the feature does and for whom, how it fits the
      existing code, and the acceptance tests that will show it works, one for each behavior it
      must have. Where there are genuinely different approaches, propose them with your
      recommendation. Ask every remaining question whose answer changes the design, give your
      recommended answer with each, and decide the rest yourself as recorded assumptions, labeled
      as your decisions so the owner can object. Record what is deferred. Keep the spec as short
      as the feature allows. When nothing material is open, order the spec for review: the
      decisions the owner must make or check, and your own decisions and assumptions, come first,
      most important first. The implementation and code review steps run the project's default
      check at their gates without the owner, so if the project's policy binds no command to it
      yet, find the command, put it to the owner with the spec, and record it in
      .konductor/policy-overrides.yml as `checks: { default: <command> }`; the owner's approval of
      the spec confirms it. Do not change code until the owner approves the spec. Commit the spec,
      unless this workstream's documents are kept private.
    updates:
      - artifact: feature-spec
        path: docs/specs/{date}-{slug}.md
    gates:
      - agent: review the spec against the owner's request, the code, and the system's requirements and design when the feature is part of a system
        guide: review.md
        max_rounds: 2
      - owner-action: approve the spec

  - id: implementation
    title: Implementation
    phase: Build
    mode: unattended
    instruction: >
      Build the approved spec. Write the spec's acceptance tests from the spec's wording, not from
      your code, and see each one fail before the code makes it pass, or break the code briefly
      and see it go red. Start every bug fix with a test that reproduces the bug and fails. How
      you test the rest is your call. Never weaken a test to get to green. If the feature is part
      of a system, also use the system end to end, with the features landed so far, for the
      requirements this feature covers. Commit as you go. When something fails unexpectedly, find
      the root cause before you change code. Decide ambiguities yourself, with the spec as the
      authority, and record each decision in the decisions file. Stop and ask only before an
      irreversible action or one that reaches outside this checkout.
    consumes: [feature-spec]
    updates:
      - artifact: code
        path: .
    gates:
      - check: default

  - id: code-review
    title: Code review
    phase: Review
    mode: unattended
    instruction: >
      Make the work ready for the owner to land. If the integration branch has moved, bring the work
      up to date with it first, the way the house rules ask, by default by rebasing it onto the
      integration branch. Get the work through review. Before the last round, shape the history the
      way the house rules ask; by default, fold fixups and review fixes into the commits it should
      land as, normally one commit for the feature, with a subject that stands on its own. Do not
      merge it into the integration branch or push it to a
      shared branch; the owner lands it. Then find out whether this project uses pull requests or
      a similar code review process: look in the project's and the user's house rules, the
      history of the integration branch, such as merge commits of pull requests or review links
      in commit messages, and what you remember of this project. Only if you find such evidence,
      tell the owner at the last gate that instead of landing the work they can approve it for
      that process, name the mechanism you found and where, and record which the owner chose in
      the gate's note; that approval passes the gate. Without evidence, do not mention pull
      requests at all.
    consumes: [feature-spec]
    updates:
      - artifact: code
        path: .
    gates:
      - check: default
      - agent: review the workstream's changes since its base commit, against the approved spec
        guide: review.md
        max_rounds: 3
        route_back_to: implementation
      - owner-action: land the work, or send it back
        route_back_to: [design, implementation]
